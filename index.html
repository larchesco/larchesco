<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larchesco | Official Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Перемикач мов -->
    <div class="lang-switcher">
        <button id="btn-en" class="lang-btn active" onclick="setLanguage('en')">EN</button>
        <button id="btn-ru" class="lang-btn" onclick="setLanguage('ru')">RU</button>
    </div>

    <h1>LARCHESCO</h1>
    <!-- Твій новий фірмовий підзаголовок -->
    <div class="subtitle" id="sub-text">Blah, blah, blah – Larchesco</div>

    <!-- Твої 6 особистих посилань -->
    <div class="links-container">
        <a href="https://kick.com/larchesco " target="_blank" class="social-link kick">🟢 Kick Stream</a>
        <a href="https://twitch.tv/larchesco " target="_blank" class="social-link twitch">🟣 Twitch</a>
        <a href="https://youtube.com/@larchesco " target="_blank" class="social-link yt">🎬 YouTube</a>
        <a href="https://tiktok.com/@larchesco " target="_blank" class="social-link">📱 TikTok</a>
        <a href="https://t.me/larchesco " target="_blank" class="social-link" id="link-tg">✈️ Telegram Channel</a>
        <a href="https://github.com/larchesco " target="_blank" class="social-link" id="link-gh">💻 GitHub</a>
    </div>

    <script>
        // Словник перекладів
        const translations = {
            en: {
                sub: "Blah, blah, blah – Larchesco",
                tg: "✈️ Telegram Channel",
                gh: "💻 GitHub"
            },
            ru: {
                sub: "Бла, бла, бла – Larchesco",
                tg: "✈️ Telegram канал",
                gh: "💻 GitHub"
            }
        };

        // Функція зміни мови
        function setLanguage(lang) {
            document.getElementById('sub-text').innerText = translations[lang].sub;
            document.getElementById('link-tg').innerText = translations[lang].tg;
            document.getElementById('link-gh').innerText = translations[lang].gh;

            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-ru').classList.remove('active');
            document.getElementById('btn-' + lang).classList.add('active');
        }
    </script>
</body>
</html>
